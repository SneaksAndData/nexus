basePath: /algorithm/v1
definitions:
  models.AlgorithmRequest:
    properties:
      algorithmParameters:
        additionalProperties: true
        type: object
      customConfiguration:
        $ref: '#/definitions/v1.NexusAlgorithmSpec'
      parentRequest:
        $ref: '#/definitions/models.AlgorithmRequestRef'
      requestApiVersion:
        type: string
      tag:
        type: string
    required:
    - algorithmParameters
    type: object
  models.AlgorithmRequestRef:
    properties:
      algorithmName:
        type: string
      requestId:
        type: string
    required:
    - algorithmName
    - requestId
    type: object
  models.CancellationRequest:
    properties:
      cancellationPolicy:
        type: string
      initiator:
        type: string
      reason:
        type: string
    type: object
  models.CheckpointedRequest:
    properties:
      algorithm:
        type: string
      algorithm_failure_cause:
        type: string
      algorithm_failure_details:
        type: string
      api_version:
        type: string
      applied_configuration:
        $ref: '#/definitions/v1.NexusAlgorithmSpec'
      configuration_overrides:
        $ref: '#/definitions/v1.NexusAlgorithmSpec'
      content_hash:
        type: string
      id:
        type: string
      job_uid:
        type: string
      last_modified:
        type: string
      lifecycle_stage:
        type: string
      parent:
        $ref: '#/definitions/models.AlgorithmRequestRef'
      payload_uri:
        type: string
      received_at:
        type: string
      received_by_host:
        type: string
      result_uri:
        type: string
      sent_at:
        type: string
      tag:
        type: string
    type: object
  models.RequestResult:
    properties:
      requestId:
        type: string
      resultUri:
        type: string
      runErrorMessage:
        type: string
      status:
        type: string
    type: object
  models.TaggedRequestResult:
    properties:
      algorithmName:
        type: string
      requestId:
        type: string
      resultUri:
        type: string
      runErrorMessage:
        type: string
      status:
        type: string
    type: object
  resource.Quantity:
    properties:
      Format:
        enum:
        - DecimalExponent
        - BinarySI
        - DecimalSI
        type: string
        x-enum-comments:
          BinarySI: e.g., 12Mi (12 * 2^20)
          DecimalExponent: e.g., 12e6
          DecimalSI: e.g., 12M  (12 * 10^6)
        x-enum-varnames:
        - DecimalExponent
        - BinarySI
        - DecimalSI
    type: object
  v1.ConfigMapEnvSource:
    properties:
      name:
        description: |-
          Name of the referent.
          This field is effectively required, but due to backwards compatibility is
          allowed to be empty. Instances of this type with an empty value here are
          almost certainly wrong.
          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
          +optional
          +default=""
          +kubebuilder:default=""
          TODO: Drop `kubebuilder:default` when controller-gen doesn't need it https://github.com/kubernetes-sigs/kubebuilder/issues/3896.
        type: string
      optional:
        description: |-
          Specify whether the ConfigMap must be defined
          +optional
        type: boolean
    type: object
  v1.ConfigMapKeySelector:
    properties:
      key:
        description: The key to select.
        type: string
      name:
        description: |-
          Name of the referent.
          This field is effectively required, but due to backwards compatibility is
          allowed to be empty. Instances of this type with an empty value here are
          almost certainly wrong.
          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
          +optional
          +default=""
          +kubebuilder:default=""
          TODO: Drop `kubebuilder:default` when controller-gen doesn't need it https://github.com/kubernetes-sigs/kubebuilder/issues/3896.
        type: string
      optional:
        description: |-
          Specify whether the ConfigMap or its key must be defined
          +optional
        type: boolean
    type: object
  v1.EnvFromSource:
    properties:
      configMapRef:
        allOf:
        - $ref: '#/definitions/v1.ConfigMapEnvSource'
        description: |-
          The ConfigMap to select from
          +optional
      prefix:
        description: |-
          Optional text to prepend to the name of each environment variable.
          May consist of any printable ASCII characters except '='.
          +optional
        type: string
      secretRef:
        allOf:
        - $ref: '#/definitions/v1.SecretEnvSource'
        description: |-
          The Secret to select from
          +optional
    type: object
  v1.EnvVar:
    properties:
      name:
        description: |-
          Name of the environment variable.
          May consist of any printable ASCII characters except '='.
        type: string
      value:
        description: |-
          Variable references $(VAR_NAME) are expanded
          using the previously defined environment variables in the container and
          any service environment variables. If a variable cannot be resolved,
          the reference in the input string will be unchanged. Double $$ are reduced
          to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
          "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
          Escaped references will never be expanded, regardless of whether the variable
          exists or not.
          Defaults to "".
          +optional
        type: string
      valueFrom:
        allOf:
        - $ref: '#/definitions/v1.EnvVarSource'
        description: |-
          Source for the environment variable's value. Cannot be used if value is not empty.
          +optional
    type: object
  v1.EnvVarSource:
    properties:
      configMapKeyRef:
        allOf:
        - $ref: '#/definitions/v1.ConfigMapKeySelector'
        description: |-
          Selects a key of a ConfigMap.
          +optional
      fieldRef:
        allOf:
        - $ref: '#/definitions/v1.ObjectFieldSelector'
        description: |-
          Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
          spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
          +optional
      fileKeyRef:
        allOf:
        - $ref: '#/definitions/v1.FileKeySelector'
        description: |-
          FileKeyRef selects a key of the env file.
          Requires the EnvFiles feature gate to be enabled.

          +featureGate=EnvFiles
          +optional
      resourceFieldRef:
        allOf:
        - $ref: '#/definitions/v1.ResourceFieldSelector'
        description: |-
          Selects a resource of the container: only resources limits and requests
          (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
          +optional
      secretKeyRef:
        allOf:
        - $ref: '#/definitions/v1.SecretKeySelector'
        description: |-
          Selects a key of a secret in the pod's namespace
          +optional
    type: object
  v1.FileKeySelector:
    properties:
      key:
        description: |-
          The key within the env file. An invalid key will prevent the pod from starting.
          The keys defined within a source may consist of any printable ASCII characters except '='.
          During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
          +required
        type: string
      optional:
        description: |-
          Specify whether the file or its key must be defined. If the file or key
          does not exist, then the env var is not published.
          If optional is set to true and the specified key does not exist,
          the environment variable will not be set in the Pod's containers.

          If optional is set to false and the specified key does not exist,
          an error will be returned during Pod creation.
          +optional
          +default=false
        type: boolean
      path:
        description: |-
          The path within the volume from which to select the file.
          Must be relative and may not contain the '..' path or start with '..'.
          +required
        type: string
      volumeName:
        description: |-
          The name of the volume mount containing the env file.
          +required
        type: string
    type: object
  v1.MountPropagationMode:
    enum:
    - None
    - HostToContainer
    - Bidirectional
    type: string
    x-enum-varnames:
    - MountPropagationNone
    - MountPropagationHostToContainer
    - MountPropagationBidirectional
  v1.NexusAlgorithmContainer:
    properties:
      image:
        type: string
      registry:
        type: string
      serviceAccountName:
        type: string
      versionTag:
        type: string
    type: object
  v1.NexusAlgorithmPayloadConfiguration:
    properties:
      payloadSerializationMode:
        allOf:
        - $ref: '#/definitions/v1.PayloadSerializationMode'
        description: |-
          +kubebuilder:default:="s3"
          +optional
      payloadValidFor:
        description: |-
          +kubebuilder:default:="24h"
          +optional
        type: string
    type: object
  v1.NexusAlgorithmResources:
    properties:
      cpuLimit:
        description: 'Deprecated: Use Limits instead'
        type: string
      customResources:
        additionalProperties:
          type: string
        type: object
      defaultResourceQuota:
        description: |-
          +kubebuilder:default:="0.1"
          +optional
        type: string
      limits:
        $ref: '#/definitions/v1.ResourceList'
      memoryLimit:
        description: 'Deprecated: Use Limits instead'
        type: string
      requests:
        $ref: '#/definitions/v1.ResourceList'
    type: object
  v1.NexusAlgorithmRuntimeEnvironment:
    properties:
      annotations:
        additionalProperties:
          type: string
        type: object
      configurationFileMounts:
        additionalProperties:
          $ref: '#/definitions/v1.VolumeMount'
        type: object
      deadlineSeconds:
        type: integer
      environmentVariables:
        items:
          $ref: '#/definitions/v1.EnvVar'
        type: array
      mappedEnvironmentVariables:
        items:
          $ref: '#/definitions/v1.EnvFromSource'
        type: array
      maximumRetries:
        type: integer
      secretFileMounts:
        additionalProperties:
          $ref: '#/definitions/v1.VolumeMount'
        type: object
      storageMounts:
        additionalProperties:
          $ref: '#/definitions/v1.VolumeMount'
        type: object
    type: object
  v1.NexusAlgorithmSpec:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        type: string
      computeResources:
        $ref: '#/definitions/v1.NexusAlgorithmResources'
      container:
        $ref: '#/definitions/v1.NexusAlgorithmContainer'
      datadogIntegrationSettings:
        $ref: '#/definitions/v1.NexusDatadogIntegrationSettings'
      errorHandlingBehaviour:
        $ref: '#/definitions/v1.NexusErrorHandlingBehaviour'
      payloadConfiguration:
        allOf:
        - $ref: '#/definitions/v1.NexusAlgorithmPayloadConfiguration'
        description: +optional
      runtimeEnvironment:
        $ref: '#/definitions/v1.NexusAlgorithmRuntimeEnvironment'
      workgroupRef:
        $ref: '#/definitions/v1.NexusAlgorithmWorkgroupRef'
    type: object
  v1.NexusAlgorithmWorkgroupRef:
    properties:
      group:
        type: string
      kind:
        type: string
      name:
        type: string
    type: object
  v1.NexusDatadogIntegrationSettings:
    properties:
      mountDatadogSocket:
        type: boolean
    type: object
  v1.NexusErrorHandlingBehaviour:
    properties:
      fatalExitCodes:
        items:
          type: integer
        type: array
      transientExitCodes:
        items:
          type: integer
        type: array
    type: object
  v1.ObjectFieldSelector:
    properties:
      apiVersion:
        description: |-
          Version of the schema the FieldPath is written in terms of, defaults to "v1".
          +optional
        type: string
      fieldPath:
        description: Path of the field to select in the specified API version.
        type: string
    type: object
  v1.PayloadSerializationMode:
    enum:
    - backend
    - s3
    type: string
    x-enum-varnames:
    - SERIALIZE_TO_BACKEND
    - SERIALIZE_TO_S3
  v1.RecursiveReadOnlyMode:
    enum:
    - Disabled
    - IfPossible
    - Enabled
    type: string
    x-enum-varnames:
    - RecursiveReadOnlyDisabled
    - RecursiveReadOnlyIfPossible
    - RecursiveReadOnlyEnabled
  v1.ResourceFieldSelector:
    properties:
      containerName:
        description: |-
          Container name: required for volumes, optional for env vars
          +optional
        type: string
      divisor:
        allOf:
        - $ref: '#/definitions/resource.Quantity'
        description: |-
          Specifies the output format of the exposed resources, defaults to "1"
          +optional
      resource:
        description: 'Required: resource to select'
        type: string
    type: object
  v1.ResourceList:
    additionalProperties:
      $ref: '#/definitions/resource.Quantity'
    type: object
  v1.SecretEnvSource:
    properties:
      name:
        description: |-
          Name of the referent.
          This field is effectively required, but due to backwards compatibility is
          allowed to be empty. Instances of this type with an empty value here are
          almost certainly wrong.
          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
          +optional
          +default=""
          +kubebuilder:default=""
          TODO: Drop `kubebuilder:default` when controller-gen doesn't need it https://github.com/kubernetes-sigs/kubebuilder/issues/3896.
        type: string
      optional:
        description: |-
          Specify whether the Secret must be defined
          +optional
        type: boolean
    type: object
  v1.SecretKeySelector:
    properties:
      key:
        description: The key of the secret to select from.  Must be a valid secret
          key.
        type: string
      name:
        description: |-
          Name of the referent.
          This field is effectively required, but due to backwards compatibility is
          allowed to be empty. Instances of this type with an empty value here are
          almost certainly wrong.
          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
          +optional
          +default=""
          +kubebuilder:default=""
          TODO: Drop `kubebuilder:default` when controller-gen doesn't need it https://github.com/kubernetes-sigs/kubebuilder/issues/3896.
        type: string
      optional:
        description: |-
          Specify whether the Secret or its key must be defined
          +optional
        type: boolean
    type: object
  v1.VolumeMount:
    properties:
      mountPath:
        description: |-
          Path within the container at which the volume should be mounted.  Must
          not contain ':'.
        type: string
      mountPropagation:
        allOf:
        - $ref: '#/definitions/v1.MountPropagationMode'
        description: |-
          mountPropagation determines how mounts are propagated from the host
          to container and the other way around.
          When not set, MountPropagationNone is used.
          This field is beta in 1.10.
          When RecursiveReadOnly is set to IfPossible or to Enabled, MountPropagation must be None or unspecified
          (which defaults to None).
          +optional
      name:
        description: This must match the Name of a Volume.
        type: string
      readOnly:
        description: |-
          Mounted read-only if true, read-write otherwise (false or unspecified).
          Defaults to false.
          +optional
        type: boolean
      recursiveReadOnly:
        allOf:
        - $ref: '#/definitions/v1.RecursiveReadOnlyMode'
        description: |-
          RecursiveReadOnly specifies whether read-only mounts should be handled
          recursively.

          If ReadOnly is false, this field has no meaning and must be unspecified.

          If ReadOnly is true, and this field is set to Disabled, the mount is not made
          recursively read-only.  If this field is set to IfPossible, the mount is made
          recursively read-only, if it is supported by the container runtime.  If this
          field is set to Enabled, the mount is made recursively read-only if it is
          supported by the container runtime, otherwise the pod will not be started and
          an error will be generated to indicate the reason.

          If this field is set to IfPossible or Enabled, MountPropagation must be set to
          None (or be unspecified, which defaults to None).

          If this field is not specified, it is treated as an equivalent of Disabled.
          +optional
      subPath:
        description: |-
          Path within the volume from which the container's volume should be mounted.
          Defaults to "" (volume's root).
          +optional
        type: string
      subPathExpr:
        description: |-
          Expanded path within the volume from which the container's volume should be mounted.
          Behaves similarly to SubPath but environment variable references $(VAR_NAME) are expanded using the container's environment.
          Defaults to "" (volume's root).
          SubPathExpr and SubPath are mutually exclusive.
          +optional
        type: string
    type: object
info:
  contact:
    email: esdsupport@ecco.com
    name: ESD Support
  description: Nexus Scheduler API specification. All Nexus supported clients conform
    to this spec.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Nexus Scheduler API
  version: "1.0"
paths:
  /algorithm/v1/buffer/{algorithmName}/requests/{requestId}:
    get:
      description: Retrieves a buffered metadata for a run
      parameters:
      - description: Algorithm name
        in: path
        name: algorithmName
        required: true
        type: string
      - description: Request identifier
        in: path
        name: requestId
        required: true
        type: string
      produces:
      - application/json
      - text/plain
      - text/html
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: Read a buffered run metadata (Kubernetes Job JSON)
      tags:
      - metadata
  /algorithm/v1/cancel/{algorithmName}/requests/{requestId}:
    post:
      consumes:
      - application/json
      description: Interrupts the provided run id and cancels the execution tree if
        it exists
      parameters:
      - description: Algorithm name
        in: path
        name: algorithmName
        required: true
        type: string
      - description: Request identifier
        in: path
        name: requestId
        required: true
        type: string
      - description: Cancellation configuration
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.CancellationRequest'
      produces:
      - application/json
      - text/plain
      - text/html
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Cancels an algorithm run
      tags:
      - cancellation
  /algorithm/v1/metadata/{algorithmName}/requests/{requestId}:
    get:
      description: Retrieves checkpointed metadata for a run
      parameters:
      - description: Algorithm name
        in: path
        name: algorithmName
        required: true
        type: string
      - description: Request identifier
        in: path
        name: requestId
        required: true
        type: string
      produces:
      - application/json
      - text/plain
      - text/html
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CheckpointedRequest'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: Read a run metadata
      tags:
      - metadata
  /algorithm/v1/payload/{algorithmName}/requests/{requestId}:
    get:
      description: Retrieves payload sent by the client for the provided run (legacy)
      parameters:
      - description: Algorithm name
        in: path
        name: algorithmName
        required: true
        type: string
      - description: Request identifier
        in: path
        name: requestId
        required: true
        type: string
      produces:
      - text/plain
      - text/html
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: string
        "302":
          description: Found
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: Read a run payload (legacy)
      tags:
      - payload
  /algorithm/v1/results/{algorithmName}/requests/{requestId}:
    get:
      description: Retrieves a result for the provided run
      parameters:
      - description: Algorithm name
        in: path
        name: algorithmName
        required: true
        type: string
      - description: Request identifier
        in: path
        name: requestId
        required: true
        type: string
      produces:
      - application/json
      - text/plain
      - text/html
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RequestResult'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: Read a run result
      tags:
      - results
  /algorithm/v1/results/tags/{requestTag}:
    get:
      description: Read results of all runs with a matching tag
      parameters:
      - description: Request tag assigned by a client
        in: path
        name: requestTag
        required: true
        type: string
      produces:
      - application/json
      - text/plain
      - text/html
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.TaggedRequestResult'
            type: array
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Read run results by tag
      tags:
      - results
  /algorithm/v1/run/{algorithmName}:
    post:
      consumes:
      - application/json
      description: Accepts an algorithm payload and places it into a scheduling queue
      parameters:
      - description: Algorithm name
        in: path
        name: algorithmName
        required: true
        type: string
      - description: Run configuration
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.AlgorithmRequest'
      - description: If false, will buffer but not submit to the target cluster
        in: query
        name: dryRun
        type: string
      produces:
      - application/json
      - text/plain
      - text/html
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Create a new algorithm run
      tags:
      - run
  /data/v1/payloads/{algorithmName}/requests/{requestId}:
    get:
      description: Retrieves payload sent by the client for the provided run
      parameters:
      - description: Algorithm name
        in: path
        name: algorithmName
        required: true
        type: string
      - description: Request identifier
        in: path
        name: requestId
        required: true
        type: string
      produces:
      - text/plain
      - text/html
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: Read a run payload
      tags:
      - payload
swagger: "2.0"
