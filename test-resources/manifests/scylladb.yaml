apiVersion: apps/v1
kind: Deployment
metadata:
  name: scylla
  namespace: nexus
  labels:
    app: scylla
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scylla
  template:
    metadata:
      labels:
        app: scylla
    spec:
      containers:
        - name: scylla
          image: scylladb/scylla
          args:
            - "--smp"
            - "1"
            - "--developer-mode=1"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - '[ "$(nodetool statusgossip)" = "running" ]'
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - '[ "$(nodetool statusgossip)" = "running" ]'
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: scylla
  namespace: nexus
spec:
  selector:
    app: scylla
  ports:
    - name: cql
      port: 9042
      targetPort: 9042
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: scylla-node-port
  namespace: nexus
spec:
  selector:
    app: scylla
  ports:
    - port: 9042
      targetPort: 9042
      nodePort: 30042
  type: NodePort
