apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: nexus
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      hostname: minio-e2e
      containers:
        - name: s2
          image: mojatter/s2-server
          env:
            - name: S2_SERVER_USER
              value: minioadmin
            - name: S2_SERVER_PASSWORD
              value: minioadmin
            - name: S2_SERVER_BUCKETS
              value: tmp,nexus,algorithms
          ports:
            - containerPort: 9000
            - containerPort: 9001
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9000
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: nexus
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: minio-node-port
  namespace: nexus
spec:
  selector:
    app: minio
  ports:
    - port: 9000
      targetPort: 9000
      nodePort: 30043
  type: NodePort
